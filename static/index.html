<html lang="zh-CN" data-page-node-id="1ldcbyvEdbB0cTkE6hfgcL">
<head data-page-node-id="obIz4Agim2nN0HjgQQaMfj">

<title>优衣库 · 尺码库存监控</title>
<style>
:root{
  --fg:#1a1a1a; --muted:#6b6b6b; --line:#e8e8e8; --soft:#fafafa;
  --accent:#d0021b; --ok:#1a7f37; --low:#b25e00; --out:#b8b8b8;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px 80px}

header{display:flex;align-items:center;gap:12px;padding:22px 0 18px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:10}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.spacer{flex:1}
input[type=text]{border:1px solid var(--line);border-radius:5px;padding:7px 10px;
  font:inherit;font-size:13px;outline:none;width:190px}
input[type=text]:focus{border-color:#bbb}
button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 13px;
  font:inherit;font-size:13px;cursor:pointer;color:var(--fg)}
button:hover{background:var(--soft)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(.93)}
button.link{border:none;background:none;color:var(--muted);padding:4px 6px;font-size:12.5px}
button.link:hover{color:var(--fg);background:none}

.tabs{display:flex;gap:20px;margin:22px 0 18px;border-bottom:1px solid var(--line)}
.tab{padding:0 0 9px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--fg);font-weight:600;border-bottom-color:var(--fg)}
.tab:hover{color:var(--fg)}

.card{border:1px solid var(--line);border-radius:7px;padding:15px 17px;margin-bottom:12px}
.card-top{display:flex;gap:14px;align-items:flex-start}
.thumb{width:64px;height:64px;border-radius:6px;object-fit:cover;border:1px solid var(--line);flex:none;background:var(--soft)}
.thumb-sm{width:38px;height:38px;border-radius:5px;object-fit:cover;border:1px solid var(--line);flex:none;background:var(--soft);cursor:zoom-in}
.card-main{flex:1;min-width:0}
.card-head{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.card-name{font-size:14.5px;font-weight:600}
.card-code{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card-meta{margin-top:8px;display:flex;gap:18px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.price-row{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.price-row .price{font-size:19px;font-weight:600;letter-spacing:-.02em}
.meta-right{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.lowv{font-size:14.5px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.origin{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:12.5px}
.badge{font-size:11.5px;padding:1px 8px;border-radius:9px;color:#fff;background:var(--accent);font-weight:500}
.badge.ok{background:var(--ok)}
.meta-row{display:flex;align-items:center;gap:12px;margin-top:7px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.status{font-size:11.5px;color:var(--ok);border:1px solid #cfe8d8;border-radius:9px;padding:1px 8px}
.status.off{color:var(--muted);border-color:var(--line)}
a.link{color:var(--muted);text-decoration:none;font-size:12.5px}
a.link:hover{color:var(--fg);text-decoration:underline}

.matrix{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;overflow-x:auto}
table{border-collapse:collapse;font-size:12.5px;min-width:100%}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:center;white-space:nowrap}
th{background:var(--soft);font-weight:600;color:var(--muted);font-size:12px}
td.cell{cursor:pointer;font-variant-numeric:tabular-nums;min-width:46px}
td.q-out{color:var(--out);background:#fbfbfb}
td.q-low{color:var(--low);font-weight:600;background:#fffaf2}
td.q-in{color:var(--fg)}
td.watched{box-shadow:inset 0 0 0 2px var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.alink{color:#185FA5;text-decoration:none;font-weight:500}
.alink:hover{text-decoration:underline}

.empty{color:var(--muted);font-size:13.5px;padding:36px 0;text-align:center}
.row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
label{font-size:13px;color:var(--muted);min-width:100px}
.setts input[type=text]{width:320px}
.ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.ev:last-child{border-bottom:none}
.ev .k{font-size:11.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);
  color:var(--muted);height:19px;line-height:17px;white-space:nowrap}
.k-OUT{color:#999}.k-IN{color:var(--ok);border-color:#cfe8d8}
.k-LOW{color:var(--low);border-color:#f0dcbf}
.k-TRANSIT{color:#2563a8;border-color:#cfe0f0}
.k-PRICE_DOWN{color:var(--accent);border-color:#f3cfd3}
.k-PRICE_UP{color:var(--muted)}
.k-TARGET_HIT{color:var(--ok);border-color:#cfe8d8}
.tgin{border:1px solid var(--line);border-radius:4px;padding:3px 8px;font:inherit;
  font-size:12.5px;width:130px;outline:none}
.tgin:focus{border-color:#bbb}
.chip{width:24px;height:24px;border-radius:4px;object-fit:cover;vertical-align:middle;
  border:1px solid var(--line);cursor:zoom-in;flex:none}
.cname{display:flex;align-items:center;gap:7px;text-align:left;white-space:nowrap}
img.thumb{cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(20,20,20,.62);display:none;
  align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
#lb img{max-width:88vw;max-height:86vh;border-radius:8px;background:#fff;
  box-shadow:0 4px 28px rgba(0,0,0,.25);will-change:transform;
  transition:transform .06s ease-out;cursor:grab}
#lb button{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;
  border:none;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;
  font-size:26px;line-height:1;cursor:pointer;padding:0}
#lb button:hover{background:rgba(255,255,255,.3)}
#lbprev{left:16px}#lbnext{right:16px}
#lbcount{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  color:#fff;font-size:13px;background:rgba(0,0,0,.3);padding:2px 10px;border-radius:10px}
#lbhint{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.75);font-size:11.5px}
.ev .t{color:var(--muted);font-size:12px;white-space:nowrap}
.msg{font-size:13px;padding:9px 12px;border-radius:5px;margin:10px 0;background:var(--soft);
  border:1px solid var(--line)}
.msg.err{background:#fdf3f3;border-color:#f3cfd3;color:#8a2b2b}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
  border-top-color:#888;border-radius:50%;animation:r .7s linear infinite;vertical-align:-1px}
@keyframes r{to{transform:rotate(360deg)}}
.note{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:10px}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
let expanded = new Set();

function show(msg, isErr){
  $('msg').innerHTML = '<div class="msg' + (isErr?' err':'') + '">' + msg + '</div>';
  if(!isErr) setTimeout(()=>{ if($('msg').innerText===msg) $('msg').innerHTML=''; }, 6000);
}
function clearMsg(){ $('msg').innerHTML=''; }

function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.tab===t));
  ['list','events','watch','settings'].forEach(x=>{ $('tab-'+x).style.display = (x===t?'':'none'); });
  if(t==='events') loadEvents();
  if(t==='watch') loadWatches();
  if(t==='settings') loadSettings();
}

async function api(url, opt){
  const r = await fetch(url, opt);
  if(!r.ok){ let d={}; try{d=await r.json()}catch(e){}
    throw new Error(d.detail || ('HTTP '+r.status)); }
  return r.json();
}

/* ---------- 列表 ---------- */
async function loadProducts(){
  $('products').innerHTML = '<div class="empty"><span class="spin"></span> 加载中…</div>';
  try{
    const rows = await api('/api/products');
    if(!rows.length){ $('products').innerHTML =
      '<div class="empty">还没有监控商品。在上方输入商品编号（如 483722）添加，或点「搜索」按关键词查找。</div>'; return; }
    $('products').innerHTML = rows.map(p=>{
      const down = (p.origin_price && p.cur_price && p.cur_price < p.origin_price)
        ? '<span class="badge">已降 ¥'+(p.origin_price-p.cur_price).toFixed(0)+'</span>' : '';
      const fmt = ts => ts ? new Date(ts*1000).toLocaleString('zh-CN',
        {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}) : '未采集';
      const hit = p.target_price
        ? (p.target_hit ? '<span class="badge ok">已达标</span>' : '<span style="font-size:12px;color:var(--muted)">预期 ¥'+p.target_price+'</span>')
        : '';
      const pic = p.main_pic
        ? '<img class="thumb" loading="lazy" src="/img/'+esc(p.main_pic.replace(/^\//,''))+'" alt="" '+
          'onerror="this.style.display=\'none\'" onclick="event.stopPropagation();viewImg(this.src)">'
        : '<div class="thumb"></div>';
      return '<div class="card">'+
        '<div class="card-top">'+
          pic+
          '<div class="card-main">'+
            '<div class="card-head" onclick="toggleMatrix(\''+p.code+'\')">'+
              '<span class="card-name">'+esc(p.name||p.code)+'</span>'+
              '<span class="card-code">'+p.code+'</span>'+
              '<span class="spacer" style="flex:1"></span>'+
              '<span class="status'+(p.enabled?'':' off')+'">'+(p.enabled?'监控中':'已暂停')+'</span>'+
            '</div>'+
            '<div class="price-row">'+
              '<span class="price">¥'+(p.cur_price??'-')+'</span>'+
              (p.origin_price&&p.origin_price!=p.cur_price?'<span class="origin">¥'+p.origin_price+'</span>':'')+
              down+hit+
              '<span class="meta-right">'+
                (p.hist_low_price!=null?'<span class="lowv">史低 ¥'+p.hist_low_price+'</span> · ':'')+
                '在售 '+p.in_stock_count+'/'+p.sku_count+' · '+fmt(p.last_ts)+
              '</span>'+
            '</div>'+
            '<div class="meta-row">'+
              '<span>预期价 ¥</span>'+
              '<input type="text" class="tgin" id="tg_'+p.code+'" placeholder="未设置" '+
                'value="'+(p.target_price!=null?p.target_price:'')+'" '+
                'onkeydown="if(event.key===\'Enter\'){event.stopPropagation();saveTarget(\''+p.code+'\')}">'+
              '<button class="link" onclick="event.stopPropagation();saveTarget(\''+p.code+'\')">保存</button>'+
              (p.target_price!=null?'<button class="link" onclick="event.stopPropagation();clearTarget(\''+p.code+'\')">清除</button>':'')+
            '</div>'+
            '<div class="meta-row" style="border-top:1px solid var(--line);padding-top:8px">'+
              '<button class="link" onclick="event.stopPropagation();toggleMatrix(\''+p.code+'\')">查看尺码</button>'+
              '<button class="link" onclick="event.stopPropagation();collectOne(\''+p.code+'\')">刷新</button>'+
              '<a class="link" href="https://h.uniqlo.cn/product?pid='+p.product_code+'" target="_blank" rel="noopener">官网页面 ↗</a>'+
              '<button class="link" onclick="event.stopPropagation();togglePause(\''+p.code+'\')">暂停/恢复</button>'+
              '<button class="link" data-del="'+p.code+'" onclick="event.stopPropagation();delProduct(\''+p.code+'\')">删除</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<div class="matrix" id="m_'+p.code+'" style="display:none"></div>'+
      '</div>';
    }).join('');
    expanded.forEach(c=>renderMatrix(c));
  }catch(e){ $('products').innerHTML = '<div class="empty">加载失败：'+esc(e.message)+'</div>'; }
}

async function saveTarget(code){
  const el = $('tg_'+code); if(!el) return;
  const v = el.value.trim();
  const body = v ? {target_price: Number(v)} : {target_price: null};
  if(v && !(Number(v)>0)){ show('预期价需为正数', true); return; }
  try{
    await api('/api/products/'+code+'/target',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    show(v?('已设置预期价 ¥'+v+'：跌到该价才推送达标通知'):'已清除预期价，恢复为「降价即推送」');
    loadProducts();
  }catch(e){ show('保存失败：'+esc(e.message), true); }
}
async function clearTarget(code){
  $('tg_'+code).value=''; saveTarget(code);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function toggleMatrix(code){
  const el = $('m_'+code);
  if(el.style.display==='none'){ el.style.display=''; expanded.add(code); renderMatrix(code); }
  else { el.style.display='none'; expanded.delete(code); }
}

async function renderMatrix(code){
  const el = $('m_'+code); if(!el) return;
  el.innerHTML = '<span class="spin"></span>';
  try{
    const [d, w, ps] = await Promise.all([
      api('/api/products/'+code+'/matrix'),
      api('/api/watches'),
      api('/api/products/'+code+'/price-series')]);
    const pc = d.product.product_code;
    const idx = {};
    d.rows.forEach(r=>{ idx[r.display_color+'|'+r.size] = r; });
    let h = priceChartHtml(ps);
    h += '<table><tr><th>颜色 \\ 尺码</th>' + d.sizes.map(s=>'<th>'+esc(s)+'</th>').join('') + '</tr>';
    d.colors.forEach(c=>{
      const fr = d.rows.find(r=>r.display_color===c);
      const cp = fr && d.color_pic_map ? d.color_pic_map[fr.color_no] : '';
      const chip = cp
        ? '<img class="chip" loading="lazy" src="/img/'+esc(cp.replace(/^\//,''))+'" alt="'+esc(c)+'" '+
          'onerror="this.style.display=\'none\'" onclick="event.stopPropagation();viewImg(this.src)">'
        : '';
      h += '<tr><th class="cname">'+chip+'<span>'+esc(c)+'</span></th>';
      d.sizes.forEach(s=>{
        const r = idx[c+'|'+s];
        if(!r){ h += '<td class="q-out">-</td>'; return; }
        const q = r.express;
        let cls = 'q-out', txt = q==null?'-':q;
        if(q>0 && q<=(2)) { cls='q-low'; }
        else if(q>2){ cls='q-in'; }
        const watched = w.some(x=>x.product_code===pc && (!x.size||x.size===s) && (!x.color||x.color===c));
        h += '<td class="cell '+cls+(watched?' watched':'')+'" title="快递 '+(q??'-')+
             ' | 前置仓 '+(r.bpl??'-')+' | 大仓 '+(r.dc??'-')+' | 在途 '+(r.transit??'-')+
             '\n点击订阅/取消"'+esc(c)+' '+esc(s)+'"'+
             '" onclick="toggleWatch(\''+pc+'\',\''+esc(c)+'\',\''+esc(s)+'\')">'+txt+'</td>';
      });
      h += '</tr>';
    });
    h += '</table><div class="hint">数字=快递可售件数（封顶20）。灰=断货，橙=≤2件紧张，红框=已订阅该色码（断货/补货会推送），点击单元格订阅/取消。'+
         '<a class="alink" href="https://h.uniqlo.cn/product?pid='+pc+'" target="_blank" rel="noopener">在官网打开此商品 ↗</a></div>';
    el.innerHTML = h;
  }catch(e){ el.innerHTML = '<span style="color:#8a2b2b">'+esc(e.message)+'</span>'; }
}

function priceChartHtml(d){
  const pts = d.points||[];
  let box = '<div style="font-size:12px;color:var(--muted);margin:2px 0 8px">价格走势（仅记录变化点）</div>';
  if(!pts.length) return box+'<div style="font-size:12px;color:var(--muted)">暂无价格记录，采集后出现</div>';
  const W=720,H=88,P=16;
  const prices = pts.map(p=>p.price);
  const min = Math.min.apply(null,prices), max = Math.max.apply(null,prices);
  const span = (max-min)||1;
  const X = i => pts.length===1 ? W/2 : P+(W-2*P)*i/(pts.length-1);
  const Y = p => P+(H-2*P)*(1-(p-min)/span);
  let path='', dots='';
  pts.forEach((p,i)=>{
    const x=X(i), y=Y(p.price);
    path += (i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1);
    dots += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.5" fill="#888780"/>';
  });
  const last = pts[pts.length-1];
  const lowPt = pts.reduce((a,b)=>b.price<a.price?b:a, pts[0]);
  const tFmt = ts => new Date(ts*1000).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})+' '+
    new Date(ts*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
  const svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
    '<line x1="'+P+'" y1="'+H+'" x2="'+P+'" y2="6" stroke="#e8e8e8" stroke-width="0.5"/>'+
    '<line x1="'+P+'" y1="'+H+'" x2="'+(W-P)+'" y2="'+H+'" stroke="#e8e8e8" stroke-width="0.5"/>'+
    '<path d="'+path+'" fill="none" stroke="#888780" stroke-width="1.2"/>'+
    dots+
    '<circle cx="'+X(pts.indexOf(lowPt)).toFixed(1)+'" cy="'+Y(lowPt.price).toFixed(1)+'" r="3.5" fill="#1a7f37"/>'+
    '<circle cx="'+X(pts.length-1).toFixed(1)+'" cy="'+Y(last.price).toFixed(1)+'" r="3.5" fill="#d0021b"/>'+
    '<text x="'+P+'" y="'+H+'" text-anchor="start" dy="-3" font-size="11" fill="#888780">'+tFmt(pts[0].ts)+'</text>'+
    '<text x="'+(W-P)+'" y="'+H+'" text-anchor="end" dy="-3" font-size="11" fill="#888780">'+tFmt(last.ts)+'</text>'+
    '<text x="'+P+'" y="12" font-size="11" fill="#1a7f37">史低 ¥'+lowPt.price+'</text>'+
    '<text x="'+(W-P)+'" y="12" text-anchor="end" font-size="11" fill="#444441">当前 ¥'+last.price+'</text>'+
    (min<max?'<text x="'+(W-P)+'" y="'+(Y(max)+8).toFixed(1)+'" text-anchor="end" font-size="11" fill="#888780">¥'+max+'</text>':'')+
  '</svg>';
  return box+svg;
}

/* ---------- 操作 ---------- */
async function addProduct(){
  const code = $('codeInput').value.trim();
  if(!code) return show('请输入商品编号', true);
  clearMsg(); show('<span class="spin"></span> 正在添加并首次采集…');
  try{
    const r = await api('/api/products', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code})});
    show('已添加：'+esc(r.product.name||code)+'（'+(r.collect.skus||0)+' 个 SKU）');
    $('codeInput').value=''; loadProducts();
  }catch(e){ show('添加失败：'+esc(e.message), true); }
}

async function searchProduct(){
  const q = $('codeInput').value.trim();
  if(!q) return show('请输入商品编号或关键词', true);
  clearMsg(); show('<span class="spin"></span> 搜索中…');
  try{
    const items = await api('/api/search?q='+encodeURIComponent(q));
    if(!items.length) return show('未找到与「'+esc(q)+'」相关的商品', true);
    clearMsg();
    $('products').innerHTML = '<div class="card"><div style="font-size:13.5px;margin-bottom:10px">搜索结果（点击添加）</div>'+
      items.map(i=>'<div class="ev" style="cursor:pointer" onclick="quickAdd(\''+i.code+'\')">'+
        '<span class="card-code">'+i.code+'</span><span>'+esc(i.name||'')+'</span>'+
        '<span class="spacer" style="flex:1"></span><span class="price">¥'+(i.price??'-')+'</span></div>').join('')+
      '</div>';
  }catch(e){ show('搜索失败：'+esc(e.message), true); }
}

async function quickAdd(code){
  $('codeInput').value = code; addProduct();
}

const refreshCd = {};   // 单商品刷新冷却（前端，60s；后端另有 30s 兜底）
let cdAll = 0;          // 全部刷新冷却

async function collectOne(code){
  const left = Math.ceil(((refreshCd[code]||0)-Date.now())/1000);
  if(left>0) return show(code+' 刷新冷却中，'+left+' 秒后再试', true);
  refreshCd[code] = Date.now()+60000;
  show('<span class="spin"></span> 正在采集 '+code+'…');
  try{ const r = await api('/api/collect/'+code,{method:'POST'});
    show(r.ok? r.message : ('采集失败：'+r.message), !r.ok); loadProducts(); }
  catch(e){ show('采集失败：'+esc(e.message), true); }
}

async function collectAll(){
  const left = Math.ceil((cdAll-Date.now())/1000);
  if(left>0) return show('全部刷新冷却中，'+left+' 秒后再试', true);
  cdAll = Date.now()+60000;
  show('<span class="spin"></span> 正在采集全部商品…');
  try{ const r = await api('/api/collect',{method:'POST'});
    show(r.summary, !r.ok); loadProducts(); }
  catch(e){ show('采集失败：'+esc(e.message), true); }
}

const delArm = {};
function delProduct(code){
  const btn = document.querySelector('[data-del="'+code+'"]');
  if(delArm[code]){
    clearTimeout(delArm[code]); delete delArm[code];
    if(btn){ btn.textContent='删除'; btn.style.color=''; }
    api('/api/products/'+code,{method:'DELETE'})
      .then(()=>{ show('已移除 '+code); loadProducts(); })
      .catch(e=>show('删除失败：'+esc(e.message), true));
    return;
  }
  delArm[code] = setTimeout(()=>{
    delete delArm[code];
    const b = document.querySelector('[data-del="'+code+'"]');
    if(b){ b.textContent='删除'; b.style.color=''; }
  }, 3000);
  if(btn){ btn.textContent='确认删除？'; btn.style.color='var(--accent)'; }
  show('再次点击「确认删除？」移除 '+code+'（3 秒内有效）');
}
async function togglePause(code){
  await api('/api/products/'+code+'/toggle',{method:'POST'}); loadProducts();
}

/* ---------- 订阅 ---------- */
async function toggleWatch(pc, color, size){
  try{
    const w = await api('/api/watches');
    const exist = w.find(x=>x.product_code===pc && x.size===size && x.color===color);
    if(exist) await api('/api/watches/'+exist.id,{method:'DELETE'});
    else await api('/api/watches',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({product_code:pc, size, color})});
    expanded.forEach(c=>renderMatrix(c)); loadWatches();
  }catch(e){ show('订阅失败：'+esc(e.message), true); }
}

async function loadWatches(){
  try{
    const w = await api('/api/watches');
    $('watches').innerHTML = w.length? ('<div class="card">'+w.map(x=>{
      const pic = x.main_pic
        ? '<img class="thumb-sm" loading="lazy" src="/img/'+esc(x.main_pic.replace(/^\//,''))+'" alt="" '+
          'onerror="this.style.display=\'none\'" onclick="viewImg(this.src)">'
        : '<div class="thumb-sm"></div>';
      return '<div class="ev" style="align-items:center;gap:11px">'+pic+
        '<span style="flex:1;min-width:0">'+
          '<span style="display:block">'+esc(x.name||x.product_code)+
          (x.code?' <span class="card-code">'+esc(x.code)+'</span>':'')+'</span>'+
          '<span class="card-code">'+esc(x.color||'任意色')+' · '+esc(x.size||'任意码')+
          (x.cur_price!=null?' · 现价 ¥'+x.cur_price:'')+
          (x.hist_low_price!=null?' · 史低 ¥'+x.hist_low_price:'')+'</span>'+
        '</span>'+
        '<button class="link" onclick="delWatch('+x.id+')">取消订阅</button></div>';
    }).join('')+'</div>')
      : '<div class="empty">还没有订阅。在「监控列表」展开尺码表，点击单元格订阅关注的尺码。</div>';
  }catch(e){ $('watches').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
async function delWatch(id){
  await api('/api/watches/'+id,{method:'DELETE'}); loadWatches();
}

/* ---------- 事件 ---------- */
async function loadEvents(){
  $('events').innerHTML = '<div class="empty"><span class="spin"></span></div>';
  try{
    const evs = await api('/api/events?limit=200');
    $('events').innerHTML = evs.length? ('<div class="card">'+evs.map(e=>
      '<div class="ev"><span class="k k-'+e.kind+'">'+kindText(e.kind)+'</span>'+
      '<span>'+esc(e.title)+'</span>'+
      (e.detail?'<span style="color:var(--muted)">'+esc(e.detail)+'</span>':'')+
      '<span class="spacer" style="flex:1"></span>'+
      '<span class="t">'+new Date(e.ts*1000).toLocaleString('zh-CN',{hour12:false})+'</span></div>').join('')+'</div>')
      : '<div class="empty">暂无变更记录。采集两轮后，库存或价格发生变化时会出现在这里。</div>';
  }catch(e){ $('events').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
function kindText(k){
  return {OUT:'断货',IN:'补货',LOW:'低库存',TRANSIT:'在途',
          PRICE_DOWN:'降价',PRICE_UP:'涨价',TARGET_HIT:'达标'}[k]||k;
}

/* ---------- 设置 ---------- */
async function loadSettings(){
  const s = await api('/api/settings');
  $('s_interval').value = s.stock_interval_min ?? 30;
  $('s_threshold').value = s.low_threshold ?? 2;
  $('s_enabled').value = String(s.notify_enabled ?? 0);
  $('s_channel').value = s.notify_channel || 'pushplus';
  $('s_pp_token').value = s.pp_token || '';
  $('s_ntfy_server').value = s.ntfy_server || '';
  $('s_ntfy_topic').value = s.ntfy_topic || '';
  $('s_webhook').value = s.wecom_webhook || '';
  $('s_quiet').value = s.quiet_hours || '';
}
async function saveSettings(){
  const body = {
    stock_interval_min: Number($('s_interval').value)||30,
    low_threshold: Number($('s_threshold').value)||2,
    notify_enabled: Number($('s_enabled').value)||0,
    notify_channel: $('s_channel').value,
    pp_token: $('s_pp_token').value.trim(),
    ntfy_server: $('s_ntfy_server').value.trim(),
    ntfy_topic: $('s_ntfy_topic').value.trim(),
    wecom_webhook: $('s_webhook').value.trim(),
    quiet_hours: $('s_quiet').value.trim()
  };
  try{ await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)}); show('设置已保存'); }
  catch(e){ show('保存失败：'+esc(e.message), true); }
}
async function testNotify(){
  show('测试通知需在后端触发（先保存设置，再对任一商品点「刷新」产生事件）');
}

let gallery = [], gIdx = 0, gScale = 1, gX = 0, gY = 0, gDrag = null;

function collectGallery(){
  gallery = [...document.querySelectorAll('img.thumb, img.thumb-sm, img.chip')]
    .filter(i=>i.style.display!=='none' && i.src)
    .map(i=>i.src);
}
function applyZoom(){
  $('lbi').style.transform = 'translate('+gX+'px,'+gY+'px) scale('+gScale+')';
}
function updateCount(){
  $('lbcount').textContent = gallery.length ? (gIdx+1)+' / '+gallery.length : '';
}
function resetView(){
  gScale = 1; gX = 0; gY = 0; applyZoom();
}
function viewImg(src){
  collectGallery();
  gIdx = Math.max(0, gallery.indexOf(src));
  resetView();
  $('lbi').src = src;
  $('lb').style.display = 'flex';
  updateCount();
}
function lbNav(d){
  if(!gallery.length) return;
  gIdx = (gIdx + d + gallery.length) % gallery.length;
  resetView();
  $('lbi').src = gallery[gIdx];
  updateCount();
}
function toggleZoom(e){
  e.stopPropagation();
  gScale = gScale > 1.5 ? 1 : 2;
  if(gScale===1){ gX=0; gY=0; }
  applyZoom();
}
function hideImg(){
  $('lb').style.display = 'none';
  $('lbi').src = '';
  gallery = []; gDrag = null;
}
document.addEventListener('keydown', e=>{
  if($('lb').style.display!=='flex') return;
  if(e.key==='Escape') hideImg();
  else if(e.key==='ArrowRight') lbNav(1);
  else if(e.key==='ArrowLeft') lbNav(-1);
});
document.addEventListener('wheel', e=>{
  if($('lb').style.display!=='flex') return;
  e.preventDefault();
  gScale = Math.min(4, Math.max(0.6, gScale + (e.deltaY<0?0.2:-0.2)));
  applyZoom();
}, {passive:false});
document.addEventListener('mousedown', e=>{
  if($('lb').style.display!=='flex') return;
  if(e.target.id!=='lbi') return;
  e.preventDefault();
  gDrag = {x:e.clientX, y:e.clientY, ox:gX, oy:gY};
  $('lbi').style.cursor = 'grabbing';
});
document.addEventListener('mousemove', e=>{
  if(!gDrag) return;
  gX = gDrag.ox + (e.clientX - gDrag.x);
  gY = gDrag.oy + (e.clientY - gDrag.y);
  applyZoom();
});
document.addEventListener('mouseup', ()=>{
  if(gDrag){ gDrag = null; $('lbi').style.cursor = 'grab'; }
});

loadProducts();
</script>
<div id="lb" onclick="if(event.target===this)hideImg()">
  <div id="lbhint">拖拽移动 · 滚轮缩放 · 双击 1×/2× · ← → 翻页 · Esc 关闭</div>
  <img id="lbi" alt="" onclick="event.stopPropagation()" ondblclick="toggleZoom(event)">
  <button id="lbprev" onclick="event.stopPropagation();lbNav(-1)" title="上一张">‹</button>
  <button id="lbnext" onclick="event.stopPropagation();lbNav(1)" title="下一张">›</button>
  <div id="lbcount"></div>
</div>
